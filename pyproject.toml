[project]
name = "financial-pdf-rag"
version = "0.1.0"
description = "Financial PDF retrieval and question answering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.0",
    "numpy>=2.4.6",
    "openai>=3.19.0",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_rag"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
